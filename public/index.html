<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b4441e">
<title>Tischbuchung – freie Tische finden</title>
<style>
  :root { --accent: #b4441e; --accent-soft: #f8e9e2; --fg: #1f1d1a; --muted: #6b665e; --line: #e4dfd6;
    --bg: #f7f4ef; --card: #fff; --ok: #2f7a3e; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  header { background: var(--accent); color: #fff; padding: 20px 16px 56px; }
  header .in, main { max-width: 760px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; opacity: .9; font-size: 15px; }
  main { padding: 0 16px 48px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: -40px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .06); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  label { display: block; font-size: 13px; color: var(--muted); min-width: 0; }
  input, select { display: block; width: 100%; margin-top: 4px; padding: 10px; font: inherit; color: var(--fg);
    background: #fff; border: 1px solid var(--line); border-radius: 10px; min-height: 44px; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .more { margin-top: 12px; }
  .more > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 15px; padding: 6px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
  .chip { border: 1px solid var(--line); background: #fff; color: var(--fg); border-radius: 999px; padding: 8px 14px;
    font: inherit; font-size: 14px; cursor: pointer; min-height: 40px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .legend { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  #status { color: var(--muted); margin: 20px 4px 12px; font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card h2 { margin: 0; font-size: 18px; }
  .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .dist { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .meta b { color: var(--fg); font-weight: 600; }
  .desc { margin: 8px 0 12px; font-size: 15px; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; }
  .slot { border: 1px solid var(--accent); background: #fff; color: var(--accent); border-radius: 10px;
    padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; }
  .slot.exact { background: var(--accent); color: #fff; }
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .err { color: #a3261b; background: #fbeceb; border-radius: 10px; padding: 10px 12px; }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(560px, calc(100vw - 16px)); max-height: calc(100vh - 16px);
    background: var(--bg); }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  .dhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 0 16px; }
  .dhead strong { font-size: 15px; }
  .close { border: 0; background: none; font-size: 26px; line-height: 1; padding: 8px 12px; cursor: pointer; color: var(--fg); }
  dialog iframe { display: block; width: 100%; border: 0; height: 520px; padding: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 32px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="in">
    <h1>Tischbuchung</h1>
    <p>Freie Tische finden und direkt reservieren</p>
  </div>
</header>
<main>
  <form class="panel" id="form">
    <div class="grid">
      <label>Datum <input type="date" name="date" required></label>
      <label>Uhrzeit <select name="time"></select></label>
      <label>Personen <select name="partySize"></select></label>
      <label>Ort <select name="place"></select></label>
      <label>Umkreis
        <select name="radiusKm">
          <option value="1">1 km</option><option value="2">2 km</option><option value="5" selected>5 km</option>
          <option value="10">10 km</option><option value="25">25 km</option>
        </select>
      </label>
      <label>Sortieren nach
        <select name="sort"><option value="distance">Entfernung</option><option value="rating">Bewertung</option></select>
      </label>
    </div>
    <details class="more">
      <summary>Vorlieben: Küche, Preis, Bewertung</summary>
      <p class="legend">Küche (keine Auswahl = alle)</p>
      <div class="chips" id="cuisines"></div>
      <div class="grid">
        <label>Preis höchstens
          <select name="maxPrice">
            <option value="">egal</option><option value="1">€</option><option value="2">€€</option>
            <option value="3">€€€</option><option value="4">€€€€</option>
          </select>
        </label>
        <label>Bewertung mindestens
          <select name="minRating">
            <option value="">egal</option><option value="3.5">3,5 ★</option><option value="4">4,0 ★</option>
            <option value="4.5">4,5 ★</option>
          </select>
        </label>
      </div>
    </details>
  </form>

  <p id="status" role="status" aria-live="polite">Lädt …</p>
  <div id="results"></div>
</main>
<footer>
  Alle Restaurants sind erfundene Demo-Einträge. ·
  <a href="/demo.html">Widget-Demo</a> · <a href="/admin.html">Für Restaurants</a>
</footer>

<dialog id="dialog" aria-labelledby="dtitle">
  <div class="dhead"><strong id="dtitle"></strong><button class="close" type="button" aria-label="Schließen">×</button></div>
  <iframe id="frame" title="Reservierung"></iframe>
</dialog>
<script src="search.js"></script>
</body>
</html>
